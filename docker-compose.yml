# ============================================================
# docker-compose.yml
# ============================================================
# Orchestrates all services:
#   - backend  : FastAPI on port 8000
#   - frontend : React/Nginx on port 3000
#   - mlflow   : MLflow tracking server on port 5000
#
# Usage:
#   docker-compose up --build      # first run
#   docker-compose up              # subsequent runs
#   docker-compose down            # stop all
# ============================================================

version: "3.9"

services:

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crop-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount models directory so they persist between rebuilds
      - ./backend/models:/app/backend/models
      - ./logs:/app/logs
      - ./mlops/mlruns:/app/mlops/mlruns
    environment:
      - PYTHONUNBUFFERED=1
      # Browser origins allowed to call this API. Never "*".
      - CROP_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    healthcheck:
      # python, not curl: the slim base image has no curl, so the old probe
      # always failed and the frontend (which waits on service_healthy) never
      # started.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # ── React Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: crop-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── MLflow Tracking Server ──────────────────────────────────
  mlflow:
    image: python:3.12-slim
    container_name: crop-mlflow
    command: >
      bash -c "pip install mlflow &&
               mlflow server
               --backend-store-uri /mlruns
               --host 0.0.0.0
               --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlops/mlruns:/mlruns
    restart: unless-stopped

volumes:
  models:
  logs:
  mlruns:
